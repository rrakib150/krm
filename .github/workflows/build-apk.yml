name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Capacitor Android platform
        run: |
          npx cap add android 2>/dev/null || echo "already exists"
          npx cap sync android

      - name: Generate and replace all icons
        run: |
          pip install Pillow -q
          python3 - << 'PYEOF'
          from PIL import Image
          import os, shutil

          src = "icon.png"
          img = Image.open(src).convert("RGBA")
          base = "android/app/src/main/res"

          sizes = {
            "mipmap-mdpi": 48,
            "mipmap-hdpi": 72,
            "mipmap-xhdpi": 96,
            "mipmap-xxhdpi": 144,
            "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
            path = os.path.join(base, folder)
            os.makedirs(path, exist_ok=True)
            resized = img.resize((size, size), Image.LANCZOS)
            # Replace all icon variants
            for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
              resized.save(os.path.join(path, name))
            print(f"{folder}: {size}x{size} done")

          # Remove adaptive icon XML folders that override PNG icons
          for folder in ["mipmap-anydpi-v26"]:
            p = os.path.join(base, folder)
            if os.path.exists(p):
              shutil.rmtree(p)
              print(f"Removed {folder}")
          PYEOF

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kents-repertory-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
